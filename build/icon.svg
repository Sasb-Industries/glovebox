<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7591ff"/>
      <stop offset="1" stop-color="#7046e0"/>
    </linearGradient>
    <linearGradient id="door" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e6e8ff"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#2a1a6b" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- macOS icon grid: 824×824 body, centred -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <!-- A folder peeking out of the compartment -->
  <path d="M318 330 h140 a24 24 0 0 1 19 9 l34 43 h195 a24 24 0 0 1 24 24 v100 h-436 v-152 a24 24 0 0 1 24-24z" fill="#ffd166"/>
  <!-- The glove compartment door -->
  <rect x="246" y="440" width="532" height="340" rx="64" fill="url(#door)" filter="url(#shadow)"/>
  <!-- Latch -->
  <rect x="442" y="496" width="140" height="40" rx="20" fill="#7046e0"/>
</svg>
